{% extends "base.html" %}

{% block title %}Create Account — HireSense AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="auth-header text-center">
            <h2 class="auth-title">Register Recruiter Account</h2>
            <p class="auth-subtitle">Get started with AI-powered resume screening</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="full_name" class="form-label">Full Name</label>
                <input type="text" name="full_name" id="full_name" class="form-control" placeholder="e.g. Rishi Pandey" required autofocus>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Work Email</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="recruiter@company.com" required>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">
                Create Recruiter Account
            </button>
        </form>

        <div class="auth-footer text-center mt-3">
            <p>Already registered? <a href="{{ url_for('login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
